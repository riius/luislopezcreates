# Cloudflare Worker config for luislopezcreates.com
# IMPORTANT: "name" must match the Worker's name in the Cloudflare dashboard.
name = "luis-portfolio"
account_id = "895708b4bdc3419e163419cdb51e204a"
main = "worker.js"
compatibility_date = "2025-09-01"

# Keeps https://luis-portfolio.<your-subdomain>.workers.dev working for testing.
workers_dev = true

# The website files (index.html, styles.css, app.js, editor.js, assets/).
[assets]
directory = "./public"
binding = "ASSETS"

# Stores the edits you publish from the site's editor.
[[kv_namespaces]]
binding = "SITE"
id = "89364d209f6248a38b3be656aaf985c4"

# ---------------------------------------------------------------------------
# CUSTOM DOMAIN
# If you deploy through GitHub + Cloudflare (Workers Builds), attach the domain in the
# dashboard instead (see README, Step 4) and leave the lines below commented out.
# If you deploy from your own computer with `npx wrangler deploy`, you can delete the
# "# " at the start of these lines and Wrangler will attach the domain for you.
#
# [[routes]]
# pattern = "luislopezcreates.com"
# custom_domain = true
#
# [[routes]]
# pattern = "www.luislopezcreates.com"
# custom_domain = true
# ---------------------------------------------------------------------------

# OPTIONAL: video uploads (R2). Turn on R2 in the dashboard first, create the bucket
#   npx wrangler r2 bucket create portfolio-media
# then delete the "# " at the start of the three lines below and deploy again.
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "portfolio-media"
